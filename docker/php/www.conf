; Pool de php-fpm para el contenedor (dev y producción).
; Se copia a /usr/local/etc/php-fpm.d/www.conf (reemplaza el pool por defecto).
; El usuario "app" se crea en el Dockerfile con uid/gid 1000, igual que el
; usuario del host (dev y VPS), para que los workers escriban sin problemas
; en el volumen montado.

[www]
user = app
group = app

listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
clear_env = no
