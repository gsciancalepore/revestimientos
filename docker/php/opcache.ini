; Configuración de OPcache para el contenedor (dev y producción).
; Se copia a /usr/local/etc/php/conf.d/91-opcache.ini

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; validate_timestamps=1 + revalidate_freq=2: seguro para dev (los cambios se ven en
; segundos) y aceptable en producción. Si se quiere el máximo rendimiento en el VPS,
; se puede cambiar a validate_timestamps=0 y revalidar tras cada deploy.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
