; Configuración general de PHP para el contenedor (dev y producción).
; Se copia a /usr/local/etc/php/conf.d/90-ceramica.ini

date.timezone = America/Argentina/Buenos_Aires

memory_limit = 256M
max_execution_time = 30
post_max_size = 20M
upload_max_filesize = 20M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
