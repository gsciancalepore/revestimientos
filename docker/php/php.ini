; Configuración general de PHP para el contenedor (dev y producción).
; Se copia a /usr/local/etc/php/conf.d/90-ceramica.ini

date.timezone = America/Argentina/Buenos_Aires

memory_limit = 256M
max_execution_time = 30
post_max_size = 20M
upload_max_filesize = 20M

expose_php = Off
display_errors = Off
log_errors = On

; Las trazas de excepciones no guardan los argumentos de las llamadas: ahí
; viajaban nombre, email y teléfono del cliente (spec observabilidad-01, OBS-07).
zend.exception_ignore_args = On
error_log = /proc/self/fd/2
